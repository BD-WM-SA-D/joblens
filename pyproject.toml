[project]
name = "joblens-contracts"
version = "0.1.0"
description = "Hợp đồng dữ liệu dùng chung của JobLens VN: JSON Schema topic Kafka, data contract bảng, fixtures."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["jsonschema>=4.23", "pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joblens_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "joblens_contracts/schemas"
"fixtures" = "joblens_contracts/fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
