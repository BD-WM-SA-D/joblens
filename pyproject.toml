[project]
name = "joblens-contracts"
version = "0.2.0"
description = "Hợp đồng dữ liệu dùng chung của JobLens VN: JSON Schema topic Kafka, contract bảng, hợp đồng API, fixtures, job_uid()."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
# ruff pin cùng bản với hook ruff trong .pre-commit-config.yaml để CI và máy cá nhân kiểm tra giống nhau
dev = ["jsonschema>=4.23", "pytest>=8", "ruff==0.8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joblens_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "joblens_contracts/schemas"
"fixtures" = "joblens_contracts/fixtures"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
