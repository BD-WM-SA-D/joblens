# Contract bảng – bản gốc ở repo joblens. Định dạng: schemas/tables/_contract.schema.json.
# Đổi contract: PR vào joblens trước (docs/project-plan/09, quy tắc 1). status: draft = chờ ADR 0001 được duyệt.
table: silver.reco_scores
version: 0.1.1
status: draft
description: Điểm gợi ý việc làm (WM5) cho người dùng synthetic. Nguồn của gold.mart_job_reco_candidates.
writer_repo: Web-mining-joblens
writer_component: image recsys-scorer (KubernetesPodOperator)
readers:
- Big-Data-Storage-and-Processing-joblens
used_by:
- WM5
write_mode: overwrite_partition
partition_spec:
- days(generated_date)
primary_key:
- generated_date
- user_id
- job_uid
- strategy
columns:
- name: generated_date
  type: date
  nullable: false
  description: Ngày sinh gợi ý
- name: user_id
  type: string
  nullable: false
  description: Người dùng (synthetic syn-u-*)
- name: job_uid
  type: string
  nullable: false
  description: sha1('<source>:<source_job_id>') – joblens_contracts.job_uid() (ADR 0001 D5)
- name: strategy
  type: string
  nullable: false
  description: popularity | content | als | hybrid
- name: score
  type: double
  nullable: false
  description: Điểm (càng cao càng phù hợp)
- name: model_version
  type: string
  nullable: false
  description: Version image
- name: run_id
  type: string
  nullable: false
  description: ID lần chạy Airflow đã ghi dòng này
notes:
- Hồ sơ kỹ năng người dùng khai báo trong app (UC004) đi vào RecSys thế nào chưa chốt – cần ADR riêng.
