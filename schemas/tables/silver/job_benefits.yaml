# Contract bảng – bản gốc ở repo joblens. Định dạng: schemas/tables/_contract.schema.json.
# Đổi contract: PR vào joblens trước (docs/project-plan/09, quy tắc 1). status: draft = chờ ADR 0001 được duyệt.
table: silver.job_benefits
version: 0.1.0
status: draft
description: >-
  Nhóm đãi ngộ nhận diện trong từng câu của tin (trích xuất thông tin của WM, cấp câu, đa nhãn). Mỗi dòng là một nhóm
  đãi ngộ trong một câu. Do image benefit-extractor của WM ghi, Airflow của BD chạy (ADR 0001 D3). Đọc trường
  benefits và description của silver.job_postings; không chuẩn hóa lương (việc của BD, ADR 0001 D2).
writer_repo: Web-mining-joblens
writer_component: image benefit-extractor (KubernetesPodOperator)
readers:
- Big-Data-Storage-and-Processing-joblens
- PTTKHT-joblens
used_by:
- UC004
- UC011
- UC012
- WM2
- WM5
write_mode: overwrite_partition
partition_spec:
- bucket(16, job_uid)
primary_key:
- job_uid
- field
- sentence_index
- benefit_group
columns:
- name: job_uid
  type: string
  nullable: false
  description: sha1('<source>:<source_job_id>') – joblens_contracts.job_uid() (ADR 0001 D5)
- name: benefit_group
  type: string
  nullable: false
  description: >-
    luong | thuong | bao_hiem | nghi_phep_team | dao_tao | phu_cap | thiet_bi | can_bang_cuoc_song | thang_tien |
    moi_truong_van_hoa | phuc_loi_khac (định nghĩa trong guideline gán nhãn đãi ngộ của WM)
- name: field
  type: string
  nullable: false
  description: benefits | description (trường của silver.job_postings chứa câu)
- name: sentence_index
  type: int
  nullable: false
  description: Thứ tự câu trong field, bắt đầu từ 0, theo cách tách câu của image
- name: sentence_text
  type: string
  nullable: false
  description: Câu làm bằng chứng, đã che email và số điện thoại; app dùng để giải thích vì sao tin khớp nguyện vọng
- name: confidence
  type: double
  nullable: false
  description: Độ tin cậy 0–1 (bản luật từ khóa ghi 1.0)
- name: extractor_version
  type: string
  nullable: false
  description: Version image, ví dụ 0.1.0-a1b2c3d
- name: run_id
  type: string
  nullable: false
  description: ID lần chạy Airflow đã ghi dòng này
