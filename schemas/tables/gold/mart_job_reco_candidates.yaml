# Contract bảng – bản gốc ở repo joblens. Định dạng: schemas/tables/_contract.schema.json.
# Đổi contract: PR vào joblens trước (docs/project-plan/09, quy tắc 1). status: draft = chờ ADR 0001 được duyệt.
table: gold.mart_job_reco_candidates
version: 0.2.0
status: draft
description: Danh sách gợi ý việc làm đã xếp hạng cho người dùng synthetic (đánh giá offline WM5, ADR 0002), từ silver.reco_scores; chỉ giữ tin còn mở và một tin mỗi dup_group_id.
writer_repo: Big-Data-Storage-and-Processing-joblens
writer_component: dbt model mart_job_reco_candidates
readers:
- Web-mining-joblens
used_by:
- WM5
write_mode: dbt
partition_spec: []
primary_key:
- user_id
- job_uid
- strategy
grain: người dùng × tin × chiến lược (ngày sinh gần nhất)
columns:
- name: user_id
  type: string
  nullable: false
  description: Người dùng (synthetic)
- name: job_uid
  type: string
  nullable: false
  description: sha1('<source>:<source_job_id>') – joblens_contracts.job_uid() (ADR 0001 D5)
- name: strategy
  type: string
  nullable: false
  description: popularity | content | als | hybrid
- name: rank
  type: int
  nullable: false
  description: Hạng trong danh sách của user theo strategy (1 = tốt nhất)
- name: score
  type: double
  nullable: false
  description: Điểm từ silver.reco_scores
- name: title
  type: string
  nullable: false
  description: Tiêu đề tin (để app khỏi join)
- name: model_version
  type: string
  nullable: false
  description: Version mô hình
- name: generated_date
  type: date
  nullable: false
  description: Ngày sinh gợi ý
notes:
- 'ADR 0002: chỉ dùng cho đánh giá offline WM5 trên người dùng synthetic và thí nghiệm ALS của BD. Cổng (PTTKHT) không đọc bảng này; gợi ý cho người dùng thật đi qua mining-service.'
