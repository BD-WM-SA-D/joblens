- name: job_uid
  type: string
  nullable: true
  description: Bắt buộc với view/save/apply
- name: query
  type: string
  nullable: true
  description: Bắt buộc với search
- name: filters_json
  type: string
  nullable: true
  description: Bộ lọc dạng JSON
- name: position
  type: int
  nullable: true
