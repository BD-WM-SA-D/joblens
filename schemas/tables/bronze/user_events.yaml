table: bronze.user_events
version: 0.1.0
status: draft
description: Luồng sự kiện SYNTHETIC events.user.v1. Mọi kết quả dùng bảng này phải ghi là synthetic.
writer_repo: Big-Data-Storage-and-Processing-joblens
writer_component: 'spark-jobs: streaming bronze'
